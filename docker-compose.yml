# MyPickCafe 로컬 개발 환경
#   서비스: postgres, ollama(임베딩), mypickcafe-ai(통합 FastAPI), mypickcafe-web(Spring Boot),
#           caddy(HTTPS 리버스 프록시)
#   선택(profiles, 기본 up 에서는 뜨지 않음):
#           prometheus·grafana(monitoring), k6(k6, 부하 테스트), chromadb(chroma-server)
#           모니터링·부하 테스트 사용법은 docs/MONITORING.md
#   덧붙임(-f 로 함께 넘길 때만): monitoring/ai-stub/docker-compose.ai-stub.yml — 느린 AI 테스트용 가짜 AI 서버
#
# 값은 이 파일과 같은 위치의 .env 에서 읽습니다(.env.example 참고). .env 는 git 에 올라가지 않습니다.
# 컨테이너끼리는 서비스 이름으로 통신합니다: postgres:5432, ollama:11434, mypickcafe-ai:8000
#
# 외부 노출 원칙 (EC2 보안 그룹 정리는 docs/ec2-security-group.md)
#   - 인터넷에 여는 포트는 caddy 의 80·443 뿐입니다.
#   - mypickcafe-web(8080)과 postgres(5432)는 호스트의 127.0.0.1 에만 엽니다.
#     postgres 는 로컬 개발(IDE 로 띄운 Spring·FastAPI)과 서버에서의 SSH 터널 접속용입니다.
#   - mypickcafe-ai, ollama, chromadb 는 호스트 포트를 열지 않고 backend 네트워크 안에서만 접근합니다.
#   - grafana(3000)·prometheus(9090)는 127.0.0.1 에만 엽니다. web 의 관리 포트(8081, actuator)는 호스트에 열지 않습니다.
#   - 네트워크는 세 개입니다. edge: caddy ↔ web, backend: web ↔ ai ↔ postgres ↔ ollama,
#     monitoring: web(8081) ↔ prometheus ↔ grafana ↔ k6.
#     caddy 는 backend 에 붙지 않으므로 프록시가 뚫려도 DB·AI 서버로 바로 넘어가지 못합니다.
#     모니터링 도구도 monitoring 에만 붙어 DB·AI 서버에 닿지 않습니다.
#
# 프로젝트 이름을 고정합니다. 기존 데이터가 들어 있는 mypickcafe_pgdata 볼륨을 계속 쓰기 위함입니다.
name: mypickcafe

services:
  postgres:
    image: postgres:16-alpine
    container_name: mypickcafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 127.0.0.1 에만 엽니다. "5432:5432" 처럼 주소를 생략하면 0.0.0.0(모든 인터페이스)에 열려
    # 보안 그룹만 남은 방어선이 됩니다. Docker 가 연 포트는 호스트 방화벽(ufw 등)도 우회합니다.
    # 로컬 개발: IDE 의 Spring(localhost:5432)·FastAPI 가 그대로 접속합니다.
    # 서버에서 DB 를 직접 보려면: ssh -L 5432:127.0.0.1:5432 ec2-user@<서버>
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - backend
    # 한도를 정해 두지 않으면 컨테이너가 호스트 메모리를 끝까지 쓸 수 있습니다.
    # t3.large(8GB) 기준 배분이며(상시 4개 합계 6.5GB), .env 에서 조정합니다.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "컨테이너 시작"과 "접속 가능"은 다릅니다. AI 서버는 이 검사가 통과한 뒤에 뜹니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: mypickcafe-ollama
    restart: unless-stopped
    volumes:
      # 모델은 볼륨에 남습니다. 컨테이너를 다시 만들어도 다시 내려받지 않습니다.
      - ollama-models:/root/.ollama
    # 임베딩 모델(bge-m3)을 메모리에 올립니다. 스택에서 가장 많이 쓰는 서비스입니다.
    # 너무 낮게 잡으면 모델을 올리다 컨테이너가 OOM 으로 죽습니다(로그에 흔적 없이 재시작).
    mem_limit: ${OLLAMA_MEM_LIMIT:-2.5g}
    # 호스트에서 이미 Ollama 가 11434 를 쓰고 있으면 충돌하므로 기본적으로 포트를 열지 않습니다.
    # 컨테이너 밖에서 확인하려면 아래 두 줄의 주석을 풀고 http://localhost:11435 로 접속하세요.
    # Ollama API 는 인증이 없으므로 반드시 127.0.0.1 에만 엽니다.
    # ports:
    #   - "127.0.0.1:11435:11434"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # GPU 사용 (NVIDIA 드라이버 + WSL2/NVIDIA Container Toolkit 필요).
    # 켜지 않으면 CPU 로 임베딩해 최초 전체 인덱싱이 수십 분 걸립니다.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 임베딩 모델을 한 번만 받아 두는 일회성 작업입니다.
  # ollama 서버의 볼륨에 저장되므로, 이미 있으면 즉시 끝나고 다시 받지 않습니다.
  ollama-init:
    image: ollama/ollama:latest
    container_name: mypickcafe-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3}"]
    networks:
      - backend
    # 모델을 내려받아 볼륨에 저장만 합니다(추론 없음).
    mem_limit: ${OLLAMA_INIT_MEM_LIMIT:-512m}
    restart: "no"

  mypickcafe-ai:
    build:
      context: ./MyPickCafe_AI
    image: mypickcafe-ai:dev
    container_name: mypickcafe-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      # LLM (OpenAI 호환) — 원격 서비스라 컨테이너 밖입니다
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      # 픽봇 1차 호출(질문 분해)의 타임아웃(초). 넘으면 재시도, 끝내 실패하면 지역 필터 없이 진행합니다.
      LLM_PARSE_TIMEOUT: ${LLM_PARSE_TIMEOUT:-5}
      # 지역 맵에 없는 표현을 LLM 에 물을 때의 타임아웃(초).
      LLM_REGION_TIMEOUT: ${LLM_REGION_TIMEOUT:-10}
      # 픽봇 1차·판정 호출의 추론량. glm-5p3-flash 는 "low" 가 필요합니다. 비추론 모델로 바꾸면 .env 에 빈 값으로 두세요.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-low}
      # 임베딩 — 같은 네트워크의 ollama 컨테이너
      EMBED_BASE_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      # 소량 임베딩을 CPU 로 돌리는 설정은 로컬에서 LLM 과 GPU 를 나눠 쓸 때를 위한 것입니다.
      # 여기서는 LLM 이 원격이라 GPU 를 다투지 않으므로 끕니다(모델을 CPU/GPU 로 번갈아 올리지 않게).
      EMBED_SMALL_BATCHES_ON_CPU: "false"
      # PostgreSQL — 같은 네트워크의 postgres 컨테이너
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # ChromaDB 인덱스 위치 (아래 볼륨)
      CHROMA_PATH: /app/chroma_db
      # Spring 만 호출할 수 있게 하는 공유 토큰. 값이 있으면 /health 를 뺀 모든 요청에
      # X-Internal-Token 헤더가 일치해야 합니다. 아래 mypickcafe-web 과 같은 값이 들어갑니다.
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # /docs·/redoc·/openapi.json 을 끕니다(엔드포인트 목록과 스키마를 숨김).
      AI_DOCS_ENABLED: "false"
    # 호스트 포트를 열지 않습니다. Spring 은 backend 네트워크에서 http://mypickcafe-ai:8000 으로 부릅니다.
    # (예전의 "8000:8000" 은 인증 없는 /pickbot/reindex·index-one·delete-one·/review/analyze 를
    #  인터넷에 그대로 열어 Spring Security 를 건너뛰는 경로였습니다.)
    # 로컬에서 컨테이너를 직접 확인해야 할 때만 아래 주석을 풉니다(127.0.0.1 전용).
    # ports:
    #   - "127.0.0.1:8000:8000"
    networks:
      - backend
    # ChromaDB 인덱스를 프로세스 안에 들고 있어 리뷰 수에 따라 사용량이 늘어납니다.
    # 현재 리뷰 약 2.8만 건 기준 220MB 정도를 쓰며, 여유를 둔 값입니다.
    mem_limit: ${AI_MEM_LIMIT:-2g}
    volumes:
      # 인덱스를 볼륨에 두어야 컨테이너를 다시 만들어도 재인덱싱하지 않습니다.
      - chroma-index:/app/chroma_db
      # RAG 선택 로그와 지역 매핑 후보(region_alias_candidates.json)를 컨테이너를 다시 만들어도 남깁니다.
      - ai-logs:/app/PickBot_AI/logs

  mypickcafe-web:
    build:
      context: ./MyPickCafe_Springboot
    image: mypickcafe-web:dev
    container_name: mypickcafe-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # AI 호출은 실패해도 서비스가 도는 부가 기능이라(빈 태그 / 503) 기동은 기다리지 않습니다.
      # 초기 인덱싱 때문에 AI 가 healthy 가 되기까지 수 분 걸릴 수 있습니다.
      mypickcafe-ai:
        condition: service_started
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 이 컨테이너는 배포용이라 기본이 prod 입니다(로컬 개발은 IDE 로 실행하며 dev 를 씁니다).
      # prod: ddl-auto=validate, Swagger 꺼짐, 에러 상세 숨김, 쿠키 Secure(HTTPS 전용)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # PostgreSQL — 같은 네트워크의 postgres 컨테이너(호스트의 localhost 가 아님)
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 통합 FastAPI — 리뷰 태그 분석과 픽봇 추천이 같은 주소를 씁니다
      PYTHON_API_BASE_URL: http://mypickcafe-ai:8000
      PICKBOT_API_BASE_URL: http://mypickcafe-ai:8000
      # AI 서버 호출에 붙이는 공유 토큰(mypickcafe-ai 의 AI_INTERNAL_TOKEN 과 같은 값)
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # 인증·외부 키
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      # prod 프로파일에서만 쓰입니다(dev 는 application-dev.properties 의 * 를 씁니다).
      # 비워 두면 서비스 주소(https://DOMAIN)만 허용합니다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      # 업로드 파일 저장소. local 은 아래 web-uploads 볼륨, s3 는 S3_BUCKET 버킷에 저장합니다.
      # s3 자격 증명은 EC2 인스턴스 역할(IAM Role)을 씁니다. 키를 쓸 때만 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 를 추가하세요.
      FILE_STORAGE: ${FILE_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # 힙은 아래 mem_limit 기준 비율로 잡힙니다. 기본값은 이미지의 JAVA_OPTS 참고.
      JAVA_OPTS: ${SPRING_JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    # 외부 접속은 caddy(443)를 거칩니다. 8080 은 서버 안(127.0.0.1)에서만 열어
    # HTTPS 를 건너뛰는 직접 접속을 막습니다.
    # 관리 포트 8081(/actuator/prometheus·health)은 호스트에 열지 않습니다. monitoring 네트워크의 prometheus 만 가져갑니다.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # edge: caddy 가 들어오는 길, backend: DB·AI 로 나가는 길,
    # monitoring: prometheus 가 지표를 가져가고(8081) k6 가 부하를 보내는(8080) 길
    networks:
      - edge
      - backend
      - monitoring
    # 컨테이너 한도를 명시해야 JVM 이 호스트 전체 메모리를 기준으로 힙을 잡지 않습니다.
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    volumes:
      # 업로드된 카페·메뉴 사진. 볼륨이 없으면 컨테이너를 다시 만들 때 사라집니다.
      # FILE_STORAGE=s3 여도 S3 전환 전에 올라온 /uploads/... 파일을 서빙하므로 남겨 둡니다.
      - web-uploads:/app/uploads
      # 사업자 증빙 등 비공개 파일(file.private-dir, FILE_STORAGE=local 일 때). URL 로 서빙하지 않습니다.
      - web-private:/app/private-uploads

  # HTTPS 리버스 프록시. 설정은 루트 Caddyfile 입니다.
  # .env 의 DOMAIN 으로 Let's Encrypt 인증서를 자동 발급·갱신합니다.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: mypickcafe-caddy
    restart: unless-stopped
    depends_on:
      - mypickcafe-web
    environment:
      # 비워 두면 localhost(자체 서명 인증서)로 뜹니다. 배포 서버에서는 반드시 지정하세요.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    # edge 에만 붙입니다. caddy 에서는 mypickcafe-web 만 보이고 postgres·AI 는 보이지 않습니다.
    networks:
      - edge
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서. 지우면 다시 발급받아야 하고, 반복하면 Let's Encrypt 발급 한도에 걸립니다.
      - caddy-data:/data
      - caddy-config:/config

  # ── 모니터링 (profiles: monitoring) ─────────────────────────────────────────
  # 기본 `docker compose up` 에서는 뜨지 않고, 배포(scripts/cd/deploy.sh)도 건드리지 않습니다.
  #   켜기: docker compose --profile monitoring up -d prometheus grafana
  #   (서비스 이름을 빼면 아직 안 뜬 AI·Ollama 등 나머지 서비스까지 모두 뜹니다)
  # 설정 파일은 monitoring/ 아래에 있습니다. 사용법은 docs/MONITORING.md 를 보세요.
  #
  # Prometheus: 15초마다 mypickcafe-web:8081/actuator/prometheus 를 가져가(pull) 저장하고 알림 규칙을 검사합니다.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: mypickcafe-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    # command 를 적으면 이미지의 기본 옵션이 통째로 바뀌므로 원래 옵션(config.file, storage.tsdb.path)도 같이 적습니다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # k6 가 테스트 결과를 보내 넣습니다(remote write). 앱 지표와 같은 곳에 쌓여 Grafana 에서 나란히 봅니다.
      - --web.enable-remote-write-receiver
    # Prometheus API 는 인증이 없고 remote write 로 아무 데이터나 넣을 수 있어 127.0.0.1 에만 엽니다.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring
    # IDE 로 띄운 앱(호스트의 8081)을 수집할 때만 씁니다(prometheus.yml 의 주석 참고). Linux 에서도 같은 이름으로 찾게 합니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

  # Grafana: Prometheus 에 질의해 그래프로 보여 줍니다. 데이터 소스와 대시보드는 파일로 자동 등록됩니다(provisioning).
  # 대시보드 JSON 을 고친 뒤에는 재시작해야 반영됩니다: docker compose restart grafana
  grafana:
    image: grafana/grafana:13.2.4
    container_name: mypickcafe-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 처음 뜰 때만 적용되고 이후에는 grafana-data 볼륨에 저장된 값을 씁니다.
      # 비워 두면 admin/admin 입니다. 서버에서 켤 때는 .env 에 반드시 지정하세요.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    # 127.0.0.1 에만 엽니다. 서버에서는 SSM 포트 포워딩 또는 SSH 터널로 접속합니다(docs/MONITORING.md).
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring
    # 실사용(anon)이 평소 약 180MB, 스트레스 테스트 중 약 220MB 입니다. 256MB 는 OOM 직전까지 가서 여유를 둡니다.
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # ── 부하 테스트 (profiles: k6) ──────────────────────────────────────────────
  # 상시 서비스가 아니라 테스트할 때만 실행하고 지우는 컨테이너입니다. 스크립트는 monitoring/k6/ 에 있습니다.
  #   docker compose run --rm k6 run /scripts/smoke.js
  #   docker compose run --rm k6 run -o experimental-prometheus-rw /scripts/load.js   (결과를 Grafana 로 보기)
  # 기본 대상은 같은 compose 의 mypickcafe-web:8080 입니다(배포와 같은 이미지·메모리 한도·prod 프로파일).
  # Caddy(HTTPS)는 거치지 않습니다. 앱의 한계를 보려는 것이라 프록시·TLS 비용은 빼고 잽니다.
  # 운영 서버(EC2)에 직접 돌리지 마세요. 실제 사용자에게 영향을 주고, 같은 서버에서 돌리면 k6 가 CPU 를 나눠 씁니다.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["k6"]
    networks:
      - monitoring
    # IDE 로 띄운 앱을 칠 때: K6_BASE_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: ${K6_BASE_URL:-http://mypickcafe-web:8080}
      # 로그인 사용자 시나리오용 계정. 비워 두면 비로그인 시나리오만 돕니다.
      K6_USER_EMAIL: ${K6_USER_EMAIL:-}
      K6_USER_PASSWORD: ${K6_USER_PASSWORD:-}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # 응답 시간을 native histogram(k6_http_req_duration_seconds)으로 보냅니다. 앱 지표처럼 histogram_quantile 로
      # "최근 30초의 p95"를 전체·화면별로 구합니다. (기본 방식인 _p95 지표는 화면별로만 나와 전체 p95 를 합칠 수 없습니다.)
      K6_FEATURES: native-histograms
    # 부하를 만드는 쪽이 병목이 되지 않도록 메모리 한도를 두지 않습니다.
    volumes:
      - ./monitoring/k6:/scripts:ro

  # ChromaDB 서버 — 기본으로 뜨지 않습니다: docker compose --profile chroma-server up -d
  #
  # 지금 애플리케이션은 chromadb.PersistentClient 로 /app/chroma_db 파일을 직접 읽고 씁니다.
  # 이 서버를 켜도 애플리케이션은 쓰지 않습니다. 쓰려면 CafeRAG 가 chromadb.HttpClient 를
  # 쓰도록 코드를 바꿔야 해서(이번 범위의 "코드 수정 금지"에 걸림) 정의만 해 두고 꺼 둡니다.
  # 둘을 동시에 켜면 인덱스가 두 곳(파일/서버)으로 갈려 헷갈립니다.
  chromadb:
    image: chromadb/chroma:latest
    container_name: mypickcafe-chromadb
    profiles: ["chroma-server"]
    restart: unless-stopped
    # 인증 없는 ChromaDB API 라 호스트 포트를 열지 않습니다. 확인이 필요하면 127.0.0.1 로만 여세요.
    # ports:
    #   - "127.0.0.1:8002:8000"
    networks:
      - backend
    mem_limit: ${CHROMA_SERVER_MEM_LIMIT:-1g}
    volumes:
      - chroma-server-data:/data

networks:
  # caddy ↔ mypickcafe-web
  edge:
    internal: false
  # mypickcafe-web ↔ mypickcafe-ai ↔ postgres ↔ ollama
  # internal: true 로 두지 않습니다. AI 서버의 원격 LLM 호출과 ollama-init 의 모델 다운로드가
  # 이 네트워크로 밖에 나가야 하기 때문입니다(들어오는 포트는 위에서 열지 않음).
  # internal 기본값: false
  backend:
    internal: false
  # mypickcafe-web(관리 포트 8081) ↔ prometheus ↔ grafana ↔ k6 — monitoring·k6 프로필을 켤 때만 다른 서비스가 붙습니다.
  # internal: true 로 두면 grafana·prometheus 의 127.0.0.1 포트 공개가 동작하지 않습니다.
  monitoring:
    internal: false

volumes:
  pgdata:              # 기존 볼륨 (mypickcafe_pgdata) — DB 데이터가 이미 들어 있습니다
  ollama-models:       # 임베딩 모델
  chroma-index:        # 애플리케이션이 쓰는 ChromaDB 인덱스
  ai-logs:             # 픽봇 로그·지역 매핑 후보
  web-uploads:         # Spring Boot 가 저장하는 업로드 파일(file.upload-dir)
  web-private:         # 관리자만 받는 비공개 파일(file.private-dir) — 사업자 증빙
  caddy-data:          # Caddy 가 발급받은 TLS 인증서
  caddy-config:        # Caddy 자동 저장 설정
  chroma-server-data:  # chroma-server 프로필을 쓸 때만
  prometheus-data:     # 수집한 지표 (monitoring 프로필)
  grafana-data:        # Grafana 로그인·설정 (monitoring 프로필)
