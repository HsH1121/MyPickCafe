# Prometheus 설정 — docker-compose.yml 의 prometheus 서비스(profiles: monitoring)가 읽습니다.
# 고친 뒤에는 재시작해야 반영됩니다: docker compose restart prometheus

global:
  scrape_interval: 15s      # 15초마다 지표를 가져갑니다
  evaluation_interval: 15s  # 15초마다 알림 규칙을 검사합니다

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # compose 로 띄운 Spring Boot(mypickcafe-web). 관리 포트 8081 은 monitoring 네트워크 안에서만 닿습니다.
  # job 이름은 대시보드와 알림 규칙이 그대로 씁니다(job="mypickcafe-web").
  - job_name: mypickcafe-web
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mypickcafe-web:8081"]

  # IDE(bootRun)로 띄운 앱을 볼 때는 위 job 을 주석 처리하고 아래 주석을 풉니다.
  # job 이름이 같아야 대시보드와 알림이 그대로 동작합니다. 같은 이름의 job 을 둘 다 켜면 Prometheus 가 뜨지 않습니다.
  # - job_name: mypickcafe-web
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8081"]
