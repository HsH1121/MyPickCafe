name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # main 은 이미지 게시·배포가 이어지므로 새 push 가 와도 진행 중인 실행을 취소하지 않습니다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  spring:
    name: Spring tests and JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MyPickCafe_Springboot
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            MyPickCafe_Springboot/*.gradle
            MyPickCafe_Springboot/gradle/wrapper/gradle-wrapper.properties
      - name: Test and build
        run: bash ./gradlew --no-daemon --console=plain test bootJar
      - name: Save Spring test reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spring-test-reports
          path: |
            MyPickCafe_Springboot/build/reports/tests/test/
            MyPickCafe_Springboot/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Save application JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spring-boot-jar
          path: MyPickCafe_Springboot/build/libs/*-SNAPSHOT.jar
          retention-days: 7
          if-no-files-found: error

  ai:
    name: AI offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MyPickCafe_AI/requirements.txt
      - name: Install the same dependencies as the AI image
        run: python -m pip install -r MyPickCafe_AI/requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile sources and run isolated offline tests
        run: python scripts/ci/run_ai_tests.py
      - name: Save AI reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-test-reports
          path: MyPickCafe_Springboot/build/reports/ai/
          retention-days: 7
          if-no-files-found: warn

  cd-script:
    name: Deploy script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/cd/deploy.sh scripts/cd/test_deploy.sh
      - name: Deploy script tests with fake docker/git
        run: bash scripts/cd/test_deploy.sh

  docker:
    name: Docker build (${{ matrix.service }})
    needs: [spring, ai, cd-script]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: MyPickCafe_Springboot
          - service: ai
            context: MyPickCafe_AI
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate Compose without starting services
        if: ${{ matrix.service == 'web' }}
        # /dev/null prevents loading a .env; all values below are disposable CI values.
        env:
          POSTGRES_DB: ci_unused
          POSTGRES_USER: ci_unused
          POSTGRES_PASSWORD: ci_unused
          LLM_BASE_URL: https://example.invalid/v1
          LLM_API_KEY: ci_unused
          LLM_MODEL: ci_unused
          JWT_SECRET: ci_unused
          DOMAIN: example.invalid
        run: docker compose --env-file /dev/null -f docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image (no registry push or deployment)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.context }}
          push: false
          tags: mypickcafe-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # main 에서만: 테스트를 통과한 커밋의 이미지를 GHCR 에 올립니다. PR·다른 브랜치에서는 실행하지 않습니다.
  publish:
    name: Publish images to GHCR
    needs: [docker]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mypickcafe" >> "$GITHUB_OUTPUT"
      # 태그는 커밋 SHA 하나만 씁니다(latest 없음). 배포는 이 태그가 가리키는 digest 로 고정합니다.
      # EC2(t3.large)는 x86_64 라 amd64 로만 빌드합니다. 위 docker job 의 캐시를 그대로 씁니다.
      - name: Build and push web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./MyPickCafe_Springboot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Build and push ai
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./MyPickCafe_AI
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-ai:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai

  # 저장소 변수 CD_ENABLED=true 일 때만 배포합니다(AWS·Environment 설정 전에는 꺼 둠).
  # 실제 배포는 production Environment 승인 뒤에 실행됩니다(.github/workflows/deploy.yml).
  deploy:
    name: Deploy
    needs: [publish]
    if: ${{ vars.CD_ENABLED == 'true' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}

  result:
    name: CI result
    if: ${{ always() }}
    needs: [spring, ai, cd-script, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test and image build to succeed
        env:
          SPRING_RESULT: ${{ needs.spring.result }}
          AI_RESULT: ${{ needs.ai.result }}
          CD_SCRIPT_RESULT: ${{ needs.cd-script.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          echo "Spring: $SPRING_RESULT; AI: $AI_RESULT; Deploy script: $CD_SCRIPT_RESULT; Docker: $DOCKER_RESULT"
          test "$SPRING_RESULT" = success
          test "$AI_RESULT" = success
          test "$CD_SCRIPT_RESULT" = success
          test "$DOCKER_RESULT" = success
