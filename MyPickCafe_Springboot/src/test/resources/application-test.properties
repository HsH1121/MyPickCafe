## =========================================================
## TEST profile - in-memory H2 so the suite runs without
## Docker/PostgreSQL. Activated via @ActiveProfiles("test").
## =========================================================

spring.datasource.url=jdbc:h2:mem:mypickcafe;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

## Secrets: fixed test values (never used outside tests).
## JwtTokenProvider Base64-decodes this, so it must be valid Base64
## decoding to >= 32 bytes (HS256 minimum key length).
app.jwt.secret=bXlwaWNrY2FmZS10ZXN0LXNlY3JldC1rZXktZm9yLWp1bml0LW9ubHktMDAwMDAx
app.cookie.secure=false
app.cors.allowed-origins=*

## External AI servers point at a closed port so tests exercise
## the failure path (graceful degradation) without any network calls.
python.api.base-url=http://localhost:19999
chatbot.api.base-url=http://localhost:19999
ai.client.connect-timeout-ms=200
ai.client.read-timeout-ms=500

## Keep test output readable
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.MyPickCafe=WARN

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
