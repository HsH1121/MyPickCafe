## =========================================================
## DEV profile - local development against Docker PostgreSQL
## Values here favour fast iteration and debuggability.
## =========================================================

## =====================
## Datasource
## =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mypickcafe}
spring.datasource.username=${DB_USERNAME:mypickcafe}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate evolve the local schema as entities change
spring.jpa.hibernate.ddl-auto=update

## =====================
## Error responses - verbose on purpose (local only)
## =====================
server.error.include-message=ALWAYS
server.error.include-binding-errors=ALWAYS
server.error.include-stacktrace=ALWAYS

## =====================
## Cookies - no TLS locally, so secure flag must stay off
## =====================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# JWT cookie issued by AuthApiController
app.cookie.secure=false

## =====================
## CORS - permissive so a local frontend on any port can call the API
## =====================
app.cors.allowed-origins=*

## =====================
## Logging
## =====================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.MyPickCafe=DEBUG

## =====================
## Swagger UI - enabled for local API exploration
## =====================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
