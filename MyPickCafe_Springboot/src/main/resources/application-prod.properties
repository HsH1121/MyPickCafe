## =========================================================
## PROD profile - every secret and endpoint comes from the
## environment. Nothing sensitive is defaulted in this file.
## =========================================================

## =====================
## Datasource - no defaults: fail fast if the environment is incomplete
## =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let Hibernate mutate a production schema.
# "validate" verifies entities match the schema and aborts startup on drift.
spring.jpa.hibernate.ddl-auto=validate

## =====================
## Connection pool
## =====================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000

## =====================
## Error responses - never leak internals to clients
## =====================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

## =====================
## Cookies - HTTPS only
## =====================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# JWT cookie issued by AuthApiController
app.cookie.secure=true

## =====================
## CORS - explicit allowlist, comma separated (e.g. https://mypickcafe.com)
## =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

## =====================
## Logging
## =====================
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.MyPickCafe=INFO
