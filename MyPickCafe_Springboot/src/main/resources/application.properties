spring.application.name=MyPickCafe
spring.config.import=file:./secret.properties

## =====================
## PostgreSQL DB
## =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/mypickcafe
spring.datasource.username=mypickcafe
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

## =====================
## JPA & Hibernate ??
## =====================
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

## =====================
## JSON / TimeZone
## =====================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Seoul

## =====================
## ?? ?? ??
## =====================
server.error.include-message=ALWAYS
server.error.include-binding-errors=ALWAYS
server.error.include-stacktrace=ALWAYS

## =====================
## ?? ?? ??
## =====================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

## =====================
## ?? ??? / ?? ??
## =====================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.web.resources.static-locations=classpath:/static/
file.upload-dir=./uploads

## =====================
## ???
## =====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

## =====================
## Mustache ???
## =====================
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.mustache
spring.mustache.check-template-location=true

## =====================
## ??
## =====================
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.example.MyPickCafe.security=DEBUG
logging.level.org.springframework.web.servlet=DEBUG

## =====================
## JWT ??
## =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

## =====================
## ??? API ?
## =====================
kakao.js-key=${KAKAO_JS_KEY:}
kakao.rest-key=${KAKAO_REST_KEY:}

## =====================
## Python AI API
## =====================
python.api.base-url=http://localhost:8000

## =====================
## Chatbot AI API
## =====================
chatbot.api.base-url=http://localhost:8001
