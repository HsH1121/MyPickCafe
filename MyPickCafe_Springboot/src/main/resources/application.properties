spring.application.name=MyPickCafe

# Active profile: dev (default) / prod
# Override at runtime: -Dspring.profiles.active=prod  or  SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# External secrets, kept out of version control (see secret.properties.example).
# "optional:" lets the app also boot from environment variables alone (CI, container).
spring.config.import=optional:file:./secret.properties

## =====================
## JPA / Hibernate (common)
## =====================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
# Batch fetch lazy associations to avoid N+1 on list screens
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.sql.init.mode=never

## =====================
## JSON / TimeZone
## =====================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Seoul

## =====================
## File upload
## =====================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.web.resources.static-locations=classpath:/static/
file.upload-dir=./uploads

## =====================
## Encoding
## =====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

## =====================
## Mustache
## =====================
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.mustache
spring.mustache.check-template-location=true

## =====================
## JWT
## =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

## =====================
## Kakao Maps API keys
## =====================
kakao.js-key=${KAKAO_JS_KEY:}
kakao.rest-key=${KAKAO_REST_KEY:}

## =====================
## External AI servers (FastAPI)
## =====================
python.api.base-url=${PYTHON_API_BASE_URL:http://localhost:8000}
chatbot.api.base-url=${CHATBOT_API_BASE_URL:http://localhost:8001}
# AI calls are best-effort: fail fast rather than blocking a user request
ai.client.connect-timeout-ms=2000
ai.client.read-timeout-ms=10000
